<!DOCTYPE html>
<html lang="vi">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Trời Ơi — bầu trời biết nói: xem thời tiết và để app trả lời hôm nay nên làm gì, mặc gì.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trời Ơi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG data-URI emoji (file TEXT nên đẩy được qua connector;
       favicon.png / icons/*.png là nhị phân, không đẩy được — D14). -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>"/>

  <title>Trời Ơi — Bầu trời biết nói</title>
  <link rel="manifest" href="manifest.json">

  <!-- Màn hình chờ tải mang thương hiệu Trời Ơi (D14): tên app,
       thuần HTML/CSS của shell — app Dart tự gỡ splash này khi
       khung hình đầu tiên hiện (sự kiện flutter-first-frame).
       Cụm V (A1): gradient splash chọn NGÀY/ĐÊM theo giờ máy người
       dùng bằng script nhỏ ngay trong head (chạy trước khi body
       được vẽ, không lóe nền ngày vào ban đêm); splash co về đúng
       cột 430px, nền ngoài cột là #E7EAEE khớp nền ngoài cột app
       ở desktop (main.dart). Cụm V (A3): splash KHÔNG còn spinner
       riêng — chỉ logo + nền; vòng quay duy nhất của luồng tải là
       CircularProgressIndicator trong app Dart (trước đây người
       dùng thấy 2 spinner 2 kiểu nối tiếp nhau). Cụm V (A4): font
       stack của splash mở đầu bằng Roboto — đúng font mặc định
       Flutter dùng cho app — để chữ splash và chữ app không lệch
       hệ (cách ít rủi ro nhất: chỉ sửa shell, không đụng theme). -->
  <script>
    // Chọn chế độ ngày/đêm cho splash theo giờ địa phương của máy
    // người dùng: 06:00–17:59 = ngày, còn lại = đêm (cùng ngưỡng
    // với initialSceneForHour ở phía Dart).
    (function () {
      var h = new Date().getHours();
      if (h < 6 || h >= 18) document.documentElement.classList.add('night');
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      /* Nền NGOÀI cột splash: khớp nền xám quanh cột app desktop. */
      background: #E7EAEE;
      font-family: Roboto, -apple-system, 'Segoe UI', Inter, sans-serif;
    }
    #splash {
      position: fixed; top: 0; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: min(430px, 100%);
      background: linear-gradient(180deg, #BFE0F5 0%, #F4FAFF 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: #1C1E21; text-align: center;
      overflow: hidden;
    }
    html.night #splash {
      background: linear-gradient(180deg, #0D1830 0%, #33507A 100%);
      color: #FFFFFF;
    }
    /* DES-3 (SPL-01): orb tĩnh trên splash — mọi số truy từ
       painter LivingSky (tâm 82%/13%, quầng r110, orb ngày r26 /
       đêm r17; màu quầng ngày #FFE9A8, đêm #E8EEF7). */
    #splash .orb {
      position: absolute; left: 82%; top: 13%;
      width: 52px; height: 52px; margin: -26px 0 0 -26px;
      border-radius: 50%;
      background: #FFD968;
    }
    #splash .orb::before {
      content: ''; position: absolute;
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,233,168,0.85) 0%, rgba(255,233,168,0) 70%);
    }
    html.night #splash .orb {
      width: 34px; height: 34px; margin: -17px 0 0 -17px;
      background: #F2F5FA;
    }
    html.night #splash .orb::before {
      background: radial-gradient(circle, rgba(232,238,247,0.85) 0%, rgba(232,238,247,0) 70%);
    }
    #splash .logo { font-size: 34px; font-weight: 800; letter-spacing: -0.6px; }
    #splash .tag { font-size: 14px; color: #52606D; }
    html.night #splash .tag { color: #B9C4D4; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Trời Ơi đang tải">
    <div class="orb" aria-hidden="true"></div>
    <div class="logo">🌤️ Trời Ơi</div>
    <div class="tag">Bầu trời biết nói — đang tải thời tiết…</div>
  </div>
  <script>
    // Gỡ splash ngay khi Flutter vẽ khung hình đầu tiên.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
